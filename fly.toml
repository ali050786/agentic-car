# fly.toml app configuration file for agentic-car worker
# Refer to https://fly.io/docs/reference/configuration/ for detailed docs.

app = "agentic-car-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.worker"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
