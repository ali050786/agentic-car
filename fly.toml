# Fly.io config for the background worker (worker/).
# Replaces the DigitalOcean droplet + Caddy setup: Fly terminates HTTPS itself.
# Runbook: docs/fly-deployment.md

app = "agentic-car-worker"
# Singapore: same region as Appwrite (sgp.cloud.appwrite.io). Every job step
# reads/writes Appwrite, so co-locating matters more than distance to users.
primary_region = "sin"

# The worker's LLM + image work spiked past 1 GB on the droplet; swap is the
# cheap safety net against OOM kills.
swap_size_mb = 1024

[build]
  dockerfile = "Dockerfile.worker"

[env]
  NODE_ENV = "production"
  WORKER_PORT = "4000"
  PIPELINE_VERSION = "v2"

[http_service]
  internal_port = 4000
  force_https = true
  # Jobs run in-process (worker/queue.ts). A stopped machine would drop them,
  # so keep exactly one machine always on.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
